<div class="review-dialog">
  <h2 mat-dialog-title>Ostavi recenziju</h2>

  <mat-dialog-content>
    <div class="reservation-info">
      <h3>{{ data.reservation.cabinName }}</h3>
      <p>{{ data.reservation.cabinLocation }}</p>
      <p>Period: {{ data.reservation.startDate | date:'dd.MM.yyyy' }} - {{ data.reservation.endDate | date:'dd.MM.yyyy' }}</p>
    </div>

    <form [formGroup]="reviewForm" class="review-form">
      <div class="rating-section">
        <label>Ocena:</label>
        <div class="rating-stars">
          <fa-icon
            *ngFor="let star of [1,2,3,4,5]"
            [class.filled]="star <= reviewForm.get('rating')?.value"
            (click)="setRating(star)"
            [icon]="faStar">
          </fa-icon>
        </div>
      </div>

      <mat-form-field appearance="outline" class="comment-field">
        <mat-label>Komentar</mat-label>
        <textarea
          matInput
          formControlName="comment"
          rows="4"
          placeholder="Podelite vaše iskustvo sa drugim korisnicima...">
        </textarea>
        <mat-hint>Opcionalno: Ostavite komentar o vašem boravku</mat-hint>
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>
      <fa-icon [icon]="faTimes"></fa-icon>
      Otkaži
    </button>
    <button
      mat-raised-button
      color="primary"
      [disabled]="!reviewForm.valid"
      (click)="submitReview()">
      <fa-icon [icon]="faPaperPlane"></fa-icon>
      Pošalji recenziju
    </button>
  </mat-dialog-actions>
</div>
