<div class="cabins-management-container">
  <div class="header">
    <h1>Upravljanje vikendicama</h1>
    <div class="header-actions">
      <input type="file" #jsonFileInput accept=".json" style="display: none" (change)="onJsonFileSelected($event)">
      <button mat-raised-button color="accent" (click)="jsonFileInput.click()">
        <fa-icon [icon]="faUpload"></fa-icon>
        Uvezi JSON
      </button>
      <button mat-raised-button color="primary" (click)="openCabinDialog()">
        <fa-icon [icon]="faPlus"></fa-icon>
        Dodaj vikendicu
      </button>
    </div>
  </div>

  <!-- Filter -->
  <div class="filter-section">
    <mat-form-field appearance="outline">
      <mat-label>Pretraga</mat-label>
      <input matInput (input)="applyFilter($event)" placeholder="Pretraži po nazivu ili lokaciji">
      <fa-icon matSuffix [icon]="faSearch"></fa-icon>
    </mat-form-field>
  </div>

  <!-- Tabela vikendica -->
  <div class="table-container" *ngIf="cabins.length > 0; else noCabins">
    <table mat-table [dataSource]="paginatedCabins" matSort (matSortChange)="sortData($event)" class="cabins-table">

      <!-- Naziv Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Naziv</th>
        <td mat-cell *matCellDef="let cabin">{{ cabin.name }}</td>
      </ng-container>

      <!-- Lokacija Column -->
      <ng-container matColumnDef="location">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Lokacija</th>
        <td mat-cell *matCellDef="let cabin">{{ cabin.place }}</td>
      </ng-container>

      <!-- Cena Column -->
      <ng-container matColumnDef="pricePerNight">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Cena po noći</th>
        <td mat-cell *matCellDef="let cabin">{{ getPricePerNight(cabin) | number:'1.2-2' }} RSD</td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let cabin">
          <span [class]="'status-' + getStatusClass(cabin)">{{ getStatusText(cabin) }}</span>
        </td>
      </ng-container>

      <!-- Akcije Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Akcije</th>
        <td mat-cell *matCellDef="let cabin">
          <button mat-icon-button (click)="editCabin(cabin)" title="Izmeni">
            <fa-icon [icon]="faEdit"></fa-icon>
          </button>
          <button mat-icon-button (click)="deleteCabin(cabin)" title="Obriši" color="warn">
            <fa-icon [icon]="faTrash"></fa-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator
      [length]="filteredCabins.length"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 25, 100]"
      (page)="onPageChange($event)"
      showFirstLastButtons>
    </mat-paginator>
  </div>

  <ng-template #noCabins>
    <div class="no-cabins">
      <fa-icon class="no-cabins-icon" [icon]="faHome"></fa-icon>
      <h2>Nemate registrovanih vikendica</h2>
      <p>Dodajte svoju prvu vikendicu da biste počeli sa iznajmljivanjem.</p>
      <button mat-raised-button color="primary" (click)="openCabinDialog()">
        <fa-icon [icon]="faPlus"></fa-icon>
        Dodaj vikendicu
      </button>
    </div>
  </ng-template>
</div>
