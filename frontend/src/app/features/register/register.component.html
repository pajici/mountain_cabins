<div class="register-container">
  <h2>Register</h2>
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-row">
      <div class="form-group">
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" formControlName="firstName" required>
      </div>
      <div class="form-group">
        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" formControlName="lastName" required>
      </div>
    </div>
    <div class="form-group">
      <label for="username">Username:</label>
      <input type="text" id="username" formControlName="username" required>
    </div>
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" formControlName="email" required>
    </div>
    <div class="form-group">
      <label for="password">Password:</label>
      <input type="password" id="password" formControlName="password" required>
    </div>
    <div class="form-group">
      <label for="gender">Gender:</label>
      <select id="gender" formControlName="gender" required>
        <option value="M">Male</option>
        <option value="Z">Female</option>
      </select>
    </div>
    <div class="form-group">
      <label for="address">Address:</label>
      <input type="text" id="address" formControlName="address">
    </div>
    <div class="form-group">
      <label for="phone">Phone:</label>
      <input type="text" id="phone" formControlName="phone">
    </div>
    <div class="form-group">
      <label for="cardNumber">Credit Card Number:</label>
      <input type="text" id="cardNumber" formControlName="cardNumber" required>
      <span *ngIf="cardType" class="card-icon">{{ cardType }}</span>
      <div *ngIf="registerForm.get('cardNumber')?.invalid && registerForm.get('cardNumber')?.touched" class="error">
        Nevažeći broj kreditne kartice
      </div>
    </div>
    <div class="form-group">
      <label for="profileImage">Profile Image:</label>
      <input type="file" id="profileImage" (change)="onFileChange($event)" accept="image/*">
    </div>
    <div class="form-group">
      <label for="role">Role:</label>
      <select id="role" formControlName="role" required>
        <option value="TOURIST">Tourist</option>
        <option value="OWNER">Owner</option>
      </select>
    </div>
    <button type="submit" [disabled]="registerForm.invalid">Register</button>
  </form>
  <p *ngIf="errorMessage">{{ errorMessage }}</p>
  <p *ngIf="successMessage">{{ successMessage }}</p>
</div>
