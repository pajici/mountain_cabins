<div class="change-password-container">
  <mat-card class="password-card">
    <mat-card-header>
      <mat-card-title>Promena Lozinke</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>Trenutna lozinka</mat-label>
          <input matInput type="password" formControlName="oldPassword" required>
          <mat-error *ngIf="passwordForm.get('oldPassword')?.invalid && passwordForm.get('oldPassword')?.touched">
            Trenutna lozinka je obavezna
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Nova lozinka</mat-label>
          <input matInput type="password" formControlName="newPassword" required>
          <mat-error *ngIf="passwordForm.get('newPassword')?.invalid && passwordForm.get('newPassword')?.touched">
            Lozinka mora imati 6-10 karaktera, počinjati slovom, sadržati bar jedno veliko slovo, tri mala slova, jedan broj i jedan specijalni karakter
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Ponovite novu lozinku</mat-label>
          <input matInput type="password" formControlName="confirmPassword" required>
          <mat-error *ngIf="passwordForm.get('confirmPassword')?.invalid && passwordForm.get('confirmPassword')?.touched">
            Lozinke se ne poklapaju
          </mat-error>
        </mat-form-field>

        <div class="button-container">
          <button mat-button type="button" (click)="cancel()">
            <fa-icon [icon]="faTimes"></fa-icon>
            Otkaži
          </button>
          <button mat-raised-button color="primary" type="submit" [disabled]="passwordForm.invalid">
            <fa-icon [icon]="faSave"></fa-icon>
            Promeni lozinku
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
