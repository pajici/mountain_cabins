<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Background -->
  <rect width="400" height="300" fill="#e0e0e0"/>
  
  <!-- Cabin structure -->
  <g transform="translate(200, 150)">
    <!-- Roof -->
    <path d="M -80 -30 L 0 -80 L 80 -30 Z" fill="#8b4513" stroke="#654321" stroke-width="2"/>
    
    <!-- Main cabin body -->
    <rect x="-70" y="-30" width="140" height="80" fill="#a0522d" stroke="#654321" stroke-width="2"/>
    
    <!-- Door -->
    <rect x="-20" y="10" width="40" height="40" fill="#654321" stroke="#4a3621" stroke-width="1"/>
    <circle cx="10" cy="30" r="2" fill="#ffd700"/>
    
    <!-- Windows -->
    <rect x="-55" y="-10" width="25" height="20" fill="#87ceeb" stroke="#4a3621" stroke-width="1"/>
    <line x1="-55" y1="0" x2="-30" y2="0" stroke="#4a3621" stroke-width="1"/>
    <line x1="-42.5" y1="-10" x2="-42.5" y2="10" stroke="#4a3621" stroke-width="1"/>
    
    <rect x="30" y="-10" width="25" height="20" fill="#87ceeb" stroke="#4a3621" stroke-width="1"/>
    <line x1="30" y1="0" x2="55" y2="0" stroke="#4a3621" stroke-width="1"/>
    <line x1="42.5" y1="-10" x2="42.5" y2="10" stroke="#4a3621" stroke-width="1"/>
    
    <!-- Chimney -->
    <rect x="40" y="-70" width="15" height="35" fill="#8b4513" stroke="#654321" stroke-width="1"/>
  </g>
  
  <!-- Trees -->
  <g transform="translate(80, 220)">
    <rect x="-5" y="-20" width="10" height="30" fill="#654321"/>
    <circle cx="0" cy="-25" r="20" fill="#228b22"/>
  </g>
  
  <g transform="translate(320, 210)">
    <rect x="-5" y="-20" width="10" height="30" fill="#654321"/>
    <circle cx="0" cy="-25" r="20" fill="#228b22"/>
  </g>
  
  <!-- Ground -->
  <rect y="240" width="400" height="60" fill="#8fbc8f"/>
</svg>
